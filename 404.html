<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found - Rawaniboy</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap');

html, body{
    margin:0;
    padding:0;
    height:100%;
    overflow:hidden;   /* Scroll OFF */
}

body{
    position:fixed;    /* Fullscreen lock */
    width:100%;
    height:100%;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:'Poppins', sans-serif;
    color:white;
    text-align:center;
}

.container{
    max-width:500px;
    padding:20px;
}

h1{
    font-size:110px;
    margin:0;
    font-weight:800;
    letter-spacing:5px;
    text-shadow:0 0 25px rgba(255,255,255,0.3);
}

h2{
    margin-top:-10px;
    font-weight:600;
    font-size:24px;
}

p{
    margin-top:10px;
    color:#ddd;
    font-size:16px;
}

.countdown{
    margin-top:12px;
    font-size:18px;
    color:#00e0ff;
}

.btn{
    margin-top:25px;
    display:inline-block;
    padding:12px 30px;
    background:#00e0ff;
    color:#000;
    text-decoration:none;
    border-radius:30px;
    font-weight:600;
    transition:0.3s ease;
}

.btn:hover{
    background:white;
    transform:scale(1.05);
}

.fade-out{
    animation: fadeOut 1s forwards;
}

@keyframes fadeOut{
    to{ opacity:0; }
}

@media(max-width:600px){
    h1{
        font-size:75px;
    }
}
</style>
</head>

<body>

<div class="container">
    <h1>404</h1>
    <h2>Oops! Page Not Found</h2>
    <p>The page you are looking for might have been removed or is temporarily unavailable.</p>

    <div class="countdown">
        Redirecting to main site in <span id="time">5</span> seconds...
    </div>

    <a href="https://www.imagetoolify.in/" class="btn">Go To Main Site</a>
</div>

<script>
let timeLeft = 5;
let timer = document.getElementById("time");

let countdown = setInterval(() => {
    timeLeft--;
    timer.textContent = timeLeft;

    if(timeLeft <= 0){
        clearInterval(countdown);
        document.body.classList.add("fade-out");
        setTimeout(() => {
            window.location.href = "https://www.imagetoolify.in/";
        }, 1000);
    }
}, 1000);
</script>

</body>
</html>
