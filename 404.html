<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>404 – Page Not Found</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">

  <style>
    body {
      margin: 0;
      height: 100vh;
      background: radial-gradient(circle at top, #020617, #000);
      font-family: Arial, sans-serif;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .box {
      text-align: center;
      max-width: 500px;
      padding: 40px;
      border-radius: 16px;
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(8px);
      box-shadow: 0 0 40px rgba(56,189,248,0.3);
    }

    h1 {
      font-size: 80px;
      margin: 0;
      color: #38bdf8;
    }

    p {
      font-size: 18px;
      opacity: 0.9;
    }

    a {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 24px;
      background: #38bdf8;
      color: #000;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
    }

    a:hover {
      background: #0ea5e9;
    }
  </style>
</head>
<body>

  <div class="box">
    <h1>404</h1>
    <p>Oops! Page not exist</p>
    <a href="/">🏠 Home Page</a>
  </div>

</body>
</html>
