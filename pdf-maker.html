<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="images/logo.png" type="image/png">
  <title>Convert Images to PDF</title>

  <!--  SEO Meta Tags -->
  <meta name="description" content="Free online Photo to PDF converter. Convert multiple images or photos into a single PDF file instantly. Works on mobile and PC without any software.">
  <meta name="keywords" content="photo to pdf, convert image to pdf, online pdf maker, jpg to pdf, png to pdf, free pdf converter, images to pdf online, rawani boy, rawani boy pdf maker">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://www.rawaniboy.site/pdf-maker.html">

  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(-45deg, #ff6a00, #ee0979, #4facfe, #00f2fe);
      background-size: 400% 400%;
      animation: gradientBG 10s ease infinite;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 15px;
      box-sizing: border-box;
    }

    @keyframes gradientBG {
      0% {background-position: 0% 50%;}
      50% {background-position: 100% 50%;}
      100% {background-position: 0% 50%;}
    }

    .container {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      padding: 40px 30px;
      border-radius: 20px;
      width: 100%;
      max-width: 650px;
      text-align: center;
      box-shadow: 0 0 30px rgba(0,0,0,0.3);
      animation: fadeIn 1s ease;
      position: relative;
    }

    @keyframes fadeIn {
      from {opacity: 0; transform: translateY(20px);}
      to {opacity: 1; transform: translateY(0);}
    }

    h1 {
      margin-bottom: 20px;
      font-size: 26px;
    }

    input[type="file"] { display: none; }

    .custom-file-upload {
      background: #ff7f50;
      color: white;
      padding: 14px 28px;
      border-radius: 50px;
      cursor: pointer;
      display: inline-block;
      font-size: 16px;
      transition: 0.3s;
      margin-bottom: 15px;
      width: auto;
    }
    .custom-file-upload:hover {
      background: #ff5722;
      transform: scale(1.05);
    }

    .download-btn {
      background: linear-gradient(90deg, #00c6ff, #0072ff);
      color: white;
      padding: 14px 40px;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: 0.3s;
      font-size: 18px;
      font-weight: bold;
      position: relative;
      overflow: hidden;
      margin-top: 10px;
    }
    .download-btn::before {
      content: "";
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.3);
      transform: skewX(-20deg);
      transition: 0.5s;
    }
    .download-btn:hover::before { left: 100%; }
    .download-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 20px rgba(0, 114, 255, 0.6);
    }

    .file-name {
      margin: 12px 0;
      font-size: 15px;
      color: #fff3cd;
      font-weight: bold;
      word-wrap: break-word;
    }

    .overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      display: none;
      z-index: 999;
    }

    .spinner {
      border: 6px solid rgba(255,255,255,0.3);
      border-top: 6px solid #fff;
      border-radius: 50%;
      width: 60px;
      height: 60px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .overlay p {
      margin-top: 15px;
      font-size: 18px;
      font-weight: bold;
      text-align: center;
    }

    .popup {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(40, 167, 69, 0.9);
      color: white;
      padding: 15px 30px;
      border-radius: 30px;
      box-shadow: 0 0 20px rgba(0,255,0,0.5);
      display: none;
      animation: slideUp 0.5s ease;
      font-weight: bold;
      backdrop-filter: blur(10px);
      text-align: center;
      z-index: 1000;
    }

    @keyframes slideUp {
      from {opacity: 0; transform: translate(-50%, 50px);}
      to {opacity: 1; transform: translate(-50%, 0);}
    }

    @media (max-width: 480px) {
      h1 { font-size: 22px; }
      .custom-file-upload, .download-btn {
        width: 100%;
        font-size: 16px;
        padding: 12px 0;
      }
      .popup {
        width: 90%;
        font-size: 14px;
        padding: 12px 15px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Photo to PDF Converter</h1>

    <label for="photoInput" class="custom-file-upload">Choose Photos</label>
    <input type="file" id="photoInput" multiple accept="image/*" aria-label="Select images to convert into PDF">
    <div id="fileNames" class="file-name"></div>

    <button class="download-btn" onclick="photosToPDF()">Download PDF</button>

    <div class="overlay" id="overlay">
      <div class="spinner"></div>
      <p>Creating your PDF...</p>
    </div>
  </div>

  <div class="popup" id="popup">✅ PDF downloaded! Check your notification bar.</div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script>
    const photoInput = document.getElementById('photoInput');
    const fileNames = document.getElementById('fileNames');
    const overlay = document.getElementById('overlay');
    const popup = document.getElementById('popup');

    photoInput.addEventListener('change', () => {
      let count = photoInput.files.length;
      fileNames.innerText = count > 0 ? `${count} image${count > 1 ? 's' : ''} selected` : '';
    });

    async function photosToPDF() {
      const { jsPDF } = window.jspdf;
      const files = photoInput.files;
      if (!files.length) return alert('Please select at least one photo.');

      overlay.style.display = 'flex';

      let pdf;
      for (let i = 0; i < files.length; i++) {
        const img = await loadImage(files[i]);
        const pxToMm = 0.264583;
        const pageWidth = img.width * pxToMm;
        const pageHeight = img.height * pxToMm;

        if (i === 0) {
          pdf = new jsPDF({
            orientation: pageWidth > pageHeight ? 'l' : 'p',
            unit: 'mm',
            format: [pageWidth, pageHeight]
          });
        } else {
          pdf.addPage([pageWidth, pageHeight], pageWidth > pageHeight ? 'l' : 'p');
        }

        pdf.addImage(img, 'JPEG', 0, 0, pageWidth, pageHeight);
      }

      const pdfBlob = pdf.output('blob');
      const url = URL.createObjectURL(pdfBlob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'photos_to_pdf.pdf';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);

      overlay.style.display = 'none';
      showPopup();
    }

    function loadImage(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.src = e.target.result;
          img.onload = () => resolve(img);
        };
        reader.readAsDataURL(file);
      });
    }

    function showPopup() {
      popup.style.display = 'block';
      setTimeout(() => { popup.style.display = 'none'; }, 5000);
    }
  </script>
</body>
</html>
