<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="images/logo.png" type="image/png">
  <title>Rawani Boy</title>
  <style>
    :root {
      --electric-blue: #00f2fe;
      --neon-pink: #fe00d7;
      --purple-haze: #9d50bb;
      --deep-space: #0f0c29;
      --cosmic-purple: #302b63;
      --starlight: #e0e5ec;
      --neon-green: #00ff9d;
      --neon-yellow: #ffe600;
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, var(--deep-space), var(--cosmic-purple));
      color: var(--starlight);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      background-size: 300% 300%;
      animation: gradientShift 15s ease infinite;
    }
    
    @keyframes gradientShift {
      0% {
        background-position: 0% 50%;
      }
      
      50% {
        background-position: 100% 50%;
      }
      
      100% {
        background-position: 0% 50%;
      }
    }
    
    .container {
      width: 100%;
      max-width: 1000px;
      text-align: center;
    }
    
    h1 {
      font-size: 3.2rem;
      font-weight: 700;
      margin-bottom: 2.5rem;
      background: linear-gradient(90deg, var(--electric-blue), var(--neon-pink));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 10px rgba(0, 242, 254, 0.3);
      animation: pulse 3s infinite;
    }
    
    @keyframes pulse {
      
      0%,
      100% {
        text-shadow: 0 0 10px rgba(0, 242, 254, 0.3);
      }
      
      50% {
        text-shadow: 0 0 20px rgba(254, 0, 215, 0.5);
      }
    }
    
    .btn-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.5rem;
    }
    
    .btn {
      position: relative;
      padding: 1.25rem;
      font-size: 1.1rem;
      font-weight: 500;
      text-decoration: none;
      border-radius: 14px;
      transition: all 0.3s ease;
      z-index: 1;
      overflow: hidden;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(6px);
      text-transform: uppercase;
      min-height: 85px;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.05);
    }
    
    .btn::after {
      content: "";
      position: absolute;
      width: 0;
      height: 0;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      transition: width 0.4s ease, height 0.4s ease;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 0;
    }
    
    .btn:hover::after {
      width: 300px;
      height: 300px;
    }
    
    .btn:hover {
      transform: translateY(-4px);
    }
    
    .btn i {
      margin-right: 12px;
      font-size: 1.5rem;
      z-index: 1;
    }
    
    .btn-text {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      z-index: 1;
    }
    
    .btn-title {
      font-weight: 600;
      font-size: 1.05rem;
    }
    
    .btn-subtitle {
      font-size: 0.8rem;
      opacity: 0.8;
    }
    
    .btn-music {
      background: linear-gradient(135deg, #8E2DE2, #4A00E0);
      color: white;
    }
    
    .btn-ai {
      background: linear-gradient(135deg, #00B4DB, #0083B0);
      color: white;
    }
    
    .btn-pdf {
      background: linear-gradient(135deg, #FF416C, #FF4B2B);
      color: white;
    }
    
    .btn-image {
      background: linear-gradient(135deg, #4CAF50, #2E7D32);
      color: white;
    }
    
    .btn-qr {
      background: linear-gradient(135deg, #FFD700, #FFA500);
      color: #333;
    }
    
    .btn-game {
      background: linear-gradient(135deg, #9C27B0, #673AB7);
      color: white;
    }
    
    .btn-barcode {
      background: linear-gradient(135deg, #00FF9D, #00C9A7);
      color: #000;
    }
    
    .insta-float-btn {
      position: fixed;
      bottom: 25px;
      right: 25px;
      width: 60px;
      height: 60px;
      background: linear-gradient(135deg, #833ab4, #fd1d1d, #fcb045);
      color: #fff;
      border-radius: 50%;
      font-size: 26px;
      display: flex;
      justify-content: center;
      align-items: center;
      text-decoration: none;
      box-shadow: 0 0 15px rgba(255, 100, 200, 0.5),
        0 0 30px rgba(255, 100, 200, 0.2);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      z-index: 1000;
    }
    
    .insta-float-btn:hover {
      transform: scale(1.1) rotate(5deg);
      box-shadow: 0 0 25px rgba(255, 100, 200, 0.8),
        0 0 50px rgba(255, 100, 200, 0.4);
    }
    
    
    @media (max-width: 600px) {
      h1 {
        font-size: 2.2rem;
        margin-bottom: 1.8rem;
      }
      
      .btn {
        padding: 1rem;
        min-height: 70px;
      }
    }
  </style>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>

<body>
  <div class="container">
    <h1>Rawani Boy</h1>
    
    <div class="btn-grid">
      <a href="ai-assistant.html" class="btn btn-ai">
        <i class="fas fa-robot"></i>
        <div class="btn-text">
          <span class="btn-title">AI Assistant</span>
          <span class="btn-subtitle">Smart help anytime</span>
        </div>
      </a>
      
      <a href="pdf-maker.html" class="btn btn-pdf">
        <i class="fas fa-file-pdf"></i>
        <div class="btn-text">
          <span class="btn-title">PDF Maker</span>
          <span class="btn-subtitle">Create PDF of images</span>
        </div>
      </a>
      
      <a href="image-size-reducer.html" class="btn btn-image">
        <i class="fas fa-image"></i>
        <div class="btn-text">
          <span class="btn-title">Image Optimizer</span>
          <span class="btn-subtitle">Reduce image size</span>
        </div>
      </a>
      
      <a href="qr-code-generator.html" class="btn btn-qr">
        <i class="fas fa-qrcode"></i>
        <div class="btn-text">
          <span class="btn-title">QR Generator</span>
          <span class="btn-subtitle">Create QR codes</span>
        </div>
      </a>
      
      <a href="barcode.html" class="btn btn-barcode">
        <i class="fas fa-barcode"></i>
        <div class="btn-text">
          <span class="btn-title">Barcode Maker</span>
          <span class="btn-subtitle">Generate barcode lines</span>
        </div>
      </a>
      
      <a href="game.html" class="btn btn-game">
        <i class="fas fa-gamepad"></i>
        <div class="btn-text">
          <span class="btn-title">Game Center</span>
          <span class="btn-subtitle">Play shooting game</span>
        </div>
      </a>
    </div>
    
    <!-- Floating Insta Button -->
    <a href="https://instagram.com/code_by_amanish" target="_blank" class="insta-float-btn" aria-label="Follow on Instagram">
      <i class="fab fa-instagram"></i>
    </a>
</body>

</html>
