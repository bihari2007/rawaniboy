<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="icon" href="images/logo.png" type="image/png">
  <title>Barcode Generator</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
      padding: 20px;
    }

    .container {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border-radius: 20px;
      padding: 40px 30px;
      box-shadow: 0 0 30px rgba(0, 255, 255, 0.1);
      width: 100%;
      max-width: 600px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.1);
      animation: fadeIn 0.8s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    h1 {
      font-size: 2.2rem;
      margin-bottom: 25px;
      background: linear-gradient(to right, #00c6ff, #0072ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .input-group {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 25px;
    }

    input {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
      background: rgba(255, 255, 255, 0.2);
      color: white;
      transition: 0.3s;
    }

    input::placeholder {
      color: #ddd;
    }

    input:focus {
      background: rgba(255, 255, 255, 0.3);
      box-shadow: 0 0 10px rgba(0, 255, 255, 0.4);
    }

    button {
      padding: 14px 24px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    #generate-btn {
      background: linear-gradient(45deg, #00c6ff, #0072ff);
      color: white;
      box-shadow: 0 0 15px rgba(0, 114, 255, 0.4);
    }

    #generate-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 20px rgba(0, 114, 255, 0.6);
    }

    .barcode-container {
      background: rgba(255, 255, 255, 0.08);
      border: 1px dashed rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      padding: 30px 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 120px;
      margin-bottom: 20px;
    }

    canvas#barcode {
      max-width: 100%;
    }

    #download-btn {
      background: linear-gradient(45deg, #ff512f, #dd2476);
      color: white;
      box-shadow: 0 0 15px rgba(255, 82, 115, 0.4);
    }

    #download-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 20px rgba(255, 82, 115, 0.6);
    }

    @media (max-width: 500px) {
      .input-group {
        flex-direction: column;
      }

      button {
        width: 100%;
      }
    }

    .container::before {
      content: '';
      position: absolute;
      top: -2px;
      left: -2px;
      right: -2px;
      bottom: -2px;
      border-radius: 22px;
      background: linear-gradient(45deg, #00fff0, #ff00ff);
      z-index: -1;
      filter: blur(15px);
      opacity: 0.2;
    }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <h1>✨ Barcode Generator</h1>
    <div class="input-group">
      <input type="text" id="barcode-data" placeholder="Enter text or number">
      <button id="generate-btn">Generate</button>
    </div>
    <div class="barcode-container">
      <canvas id="barcode" width="500" height="150"></canvas>
    </div>
    <button id="download-btn">⬇️ Download Barcode</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const barcodeDataInput = document.getElementById('barcode-data');
      const generateBtn = document.getElementById('generate-btn');
      const downloadBtn = document.getElementById('download-btn');
      const barcodeCanvas = document.getElementById('barcode');

      generateBtn.addEventListener('click', generateBarcode);
      downloadBtn.addEventListener('click', downloadBarcode);

      function generateBarcode() {
        const data = barcodeDataInput.value.trim();
        if (!data) {
          alert('Please enter some text to generate a barcode');
          return;
        }

        // Set canvas dimensions and white background
        barcodeCanvas.width = 500;
        barcodeCanvas.height = 150;
        const ctx = barcodeCanvas.getContext("2d");
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, barcodeCanvas.width, barcodeCanvas.height);

        try {
          JsBarcode(barcodeCanvas, data, {
            format: "CODE128",
            lineColor: "#000000",
            background: "#ffffff",
            width: 2,
            height: 100,
            displayValue: true,
            fontOptions: "bold",
            textMargin: 10,
            margin: 10
          });
        } catch (e) {
          alert('Error generating barcode: ' + e.message);
        }
      }

      function downloadBarcode() {
        if (!barcodeCanvas.toDataURL().includes('image/png')) {
          alert('Please generate a barcode first');
          return;
        }
        const link = document.createElement('a');
        link.download = 'barcode.png';
        link.href = barcodeCanvas.toDataURL('image/png');
        link.click();
      }
    });
  </script>
</body>
</html>
